sonar.projectKey=xmpp-react-hooks
sonar.sources=src
sonar.tests=tests

# One report per tier: the tiers run separately, so a single directory would
# leave whichever ran last as the only surviving report.
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
sonar.typescript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
